<!doctype html><meta charset="utf-8"><title>gitenv</title>
<script>
// AIDEV-NOTE: GitHub Pages serves this for /gitenv/owner/repo. Turn the path into a hash deep link.
(function(){
  var parts = location.pathname.split('/').filter(Boolean); // ["gitenv","owner","repo",...]
  var base = '/' + (parts[0] || '') + '/';
  var rest = parts.slice(1).join('/');
  location.replace(base + (rest ? '#' + rest : '') + location.search);
})();
</script>

<audio id="peerAudio" autoplay playsinline></audio><script>/* Cinderfall. Original meshes. Coordinates are in arena metres. */
const ForgeMesh = (() => {
  const TAU = Math.PI * 2;
  const colors = {
    slate:[.23,.25,.27], iron:[.15,.17,.19], coal:[.075,.087,.105], basalt:[.19,.185,.18],
    light:[.33,.35,.36], copper:[.48,.28,.16], brass:[.65,.41,.20],
    orange:[1,.195,.027], ember:[1,.37,.055], white:[1,.78,.44], deep:[.091,.094,.098],
    teal:[.13,.85,.88], violet:[.58,.29,1]
  };
  const tint = (c,k) => c.map(v=>Math.min(1,v*k));
  function mesh() {
    const data=[];
    let transform=null;
    function point(p) {
      if(!transform) return p;
      const [x,y,z,c,s]=transform;
      return [x+p[0]*c+p[2]*s,y+p[1],z-p[0]*s+p[2]*c];
    }
    function tri(a,b,c,col,mat) {
      a=point(a); b=point(b); c=point(c);
      const u=b.map((v,i)=>v-a[i]),v=c.map((n,i)=>n-a[i]);
      const n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];
      const l=Math.hypot(...n); if(l<1e-8)return;
      for (const p of [a,b,c]) data.push(...p,n[0]/l,n[1]/l,n[2]/l,...col,mat);
    }
    function quad(a,b,c,d,col,mat=0) {tri(a,b,c,col,mat);tri(a,c,d,col,mat);}
    function box(x,y,z,w,h,d,col,mat=0) {
      const X=x+w/2,Y=y+h/2,Z=z+d/2; x-=w/2;y-=h/2;z-=d/2;
      quad([x,Y,z],[x,Y,Z],[X,Y,Z],[X,Y,z],col,mat);
      quad([x,y,z],[X,y,z],[X,y,Z],[x,y,Z],col,mat);
      quad([x,y,z],[x,Y,z],[X,Y,z],[X,y,z],col,mat);
      quad([X,y,Z],[X,Y,Z],[x,Y,Z],[x,y,Z],col,mat);
      quad([x,y,Z],[x,Y,Z],[x,Y,z],[x,y,z],col,mat);
      quad([X,y,z],[X,Y,z],[X,Y,Z],[X,y,Z],col,mat);
    }
    // Ring pairs allow stepped, bevelled, tapered, and twisted casting profiles.
    function lathe(x,z,rings,n,col,mat=0,phase=Math.PI/4) {
      const P=(r,i)=>[x+Math.cos(phase+i*TAU/n+(r[3]||0))*r[1],r[0],z+Math.sin(phase+i*TAU/n+(r[3]||0))*(r[2]??r[1])];
      for(let j=0;j<rings.length-1;j++) for(let i=0;i<n;i++) {
        quad(P(rings[j],i+1),P(rings[j],i),P(rings[j+1],i),P(rings[j+1],i+1),col,mat);
      }
      for(let i=1;i<n-1;i++){
        tri(P(rings[0],0),P(rings[0],i),P(rings[0],i+1),col,mat);
        const last=rings.at(-1);tri(P(last,0),P(last,i+1),P(last,i),col,mat);
      }
    }
    // Prism extruded from a counterclockwise profile in XY, viewed from +Z.
    function profile(points,z,depth,col,mat=0) {
      for(let i=0;i<points.length;i++){
        const a=points[i],b=points[(i+1)%points.length];
        quad([...a,z+depth/2],[...a,z-depth/2],[...b,z-depth/2],[...b,z+depth/2],col,mat);
      }
      for(let i=1;i<points.length-1;i++){
        tri([...points[0],z+depth/2],[...points[i],z+depth/2],[...points[i+1],z+depth/2],col,mat);
        tri([...points[0],z-depth/2],[...points[i+1],z-depth/2],[...points[i],z-depth/2],col,mat);
      }
    }
    function beam(a,b,width,depth,col,mat=0) {
      const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;
      const u=-dy/l*width/2,v=dx/l*width/2;
      profile([[a[0]-u,a[1]-v],[b[0]-u,b[1]-v],[b[0]+u,b[1]+v],[a[0]+u,a[1]+v]],a[2],depth,col,mat);
    }
    function at(x,y,z,ang,draw) {
      const old=transform;
      if(old)throw Error('Nested mesh transform');
      transform=[x,y,z,Math.cos(ang),Math.sin(ang)];
      try{draw();}finally{transform=old;}
    }
    return {box,lathe,profile,tri,quad,beam,at,result:()=>new Float32Array(data)};
  }
  return {mesh,colors,tint,TAU};
})();

function buildArena() {
  const {mesh,colors:C,tint,TAU}=ForgeMesh, m=mesh();
  const {box,lathe,quad,beam,at,profile}=m;
  const solids=[];
  function solid(x,y,z,w,h,d,col,mat=0) {
    box(x,y,z,w,h,d,col,mat);solids.push({x,y,z,w,h,d});
  }
  function rail(x,z,angle,length,y=4.2) {
    at(x,y,z,angle,()=>{
      box(0,.94,0,length,.105,.14,C.brass,1);
      box(0,.47,0,length,.08,.09,C.iron,1);
      for(let xx=-length/2;xx<=length/2+.01;xx+=length/4) {
        box(xx,.48,0,.15,.96,.17,C.slate,1);box(xx,.14,0,.31,.28,.3,C.coal,1);
      }
    });
  }
  solid(0,-.55,0,56,1.1,56,[.28,.285,.28],3);
  // Drain cuts, copper expansion joints, two flush lava inspection trenches.
  for(let i=-24;i<=24;i+=4) {
    box(i,.011,0,.035,.016,55,C.deep,1);
    box(0,.011,i,55,.016,.035,C.deep,1);
  }
  for(const s of [-1,1]) {
    const x=10*s;
    box(x,.023,0,2.5,.034,15.6,C.coal,1);
    box(x,.05,0,1.95,.035,15,[1,.23,.028],4);
    for(const e of [-1,1])box(x+e*1.10,.10,0,.19,.18,15.8,C.copper,1);
    for(let z=-7.1;z<=7.2;z+=1.03){
      for(const e of [-1,1])box(x+e*1.1,.206,z,.21,.036,.09,C.light,1);
      if(Math.abs(z)<1.5)box(x,.15,z,2.38,.20,.32,C.iron,1);
    }
  }
  // Outer walls face inward. Their deep arches also frame the open sky.
  for(let side=0;side<4;side++){
    const angle=side*Math.PI/2;
    const pos=[-Math.sin(angle)*28,0,-Math.cos(angle)*28];
    if(side%2===0)solids.push({x:0,y:4,z:pos[2],w:58,h:8,d:1});
    else solids.push({x:pos[0],y:4,z:0,w:1,h:8,d:58});
    at(...pos,angle,()=>{
      box(0,3,-.4,57,6,1.2,C.basalt);
      box(0,1.2,.28,56.2,2.1,.8,C.iron,1);
      box(0,4.65,.12,56.8,.28,1.5,C.copper,1);
      box(0,6.12,-.24,56.9,.4,1.65,C.iron,1);
      for(let j=-3;j<=3;j++) {
        const x=j*8, k=((j+3+side*3)%4)/4;
        // Massive fluted external buttresses with cut-back shoulders.
        box(x,6.5,0,2,13,2.4,C.slate);
        box(x,1.1,1.05,3.6,2.2,2.1,C.coal,1);
        box(x,2.41,.97,3.22,.42,1.88,C.copper,1);
        box(x,7.15,1.13,1.35,9,1.13,tint(C.light,.81));
        for(const t of [-1,1]) {
          box(x+t*.70,7.45,1.68,.13,8.7,.18,C.iron,1);
          box(x+t*.38,7.8,1.73,.13,6.25,.13,C.copper,1);
        }
        box(x,7.6,1.74,.13,7.4,.09,C.ember,2);
        box(x,11.95,.5,2.55,.68,2.8,C.iron,1);
        lathe(x,.15,[[12.2,1.29],[13.35,1.03],[16.1+k*3,.34],[17+k*3,.09]],4,C.slate,0);
        box(x,13.25,.4,1.44,.22,1.8,C.copper,1);
        if(j===3)continue;
        const cx=x+4;
        // Four tapered voussoirs on each side converge on a pointed arch.
        for(const s of [-1,1]){
          const pts=[[cx+s*3.8,6],[cx+s*3.55,7.85],[cx+s*2.75,9.45],[cx+s*1.65,10.72],[cx,12.04]];
          for(let i=0;i<pts.length-1;i++){
            const a=pts[i],b=pts[i+1];
            beam([...a,.05],[...b,.05],1.18,1.65,C.slate);
            beam([...a,.96],[...b,.96],.25,.24,C.copper,1);
          }
          const eye=[[cx+s*1.33,6],[cx+s*1.33,7.1],[cx+s*.82,8.1],[cx,8.83]];
          for(let i=0;i<eye.length-1;i++)beam([...eye[i],-.27],[...eye[i+1],-.27],.19,.28,C.coal,1);
        }
        box(cx,11.93,.24,.66,.76,2,C.iron,1);
        box(cx,1.9,.87,3.55,2.8,.26,C.coal,1);
        for(let k=0;k<6;k++)box(cx-1.26+k*.5,1.94,1.03,.17,2.35,.16,C.slate,1);
        box(cx,3.66,.72,2.15,.18,.3,C.orange,2);
      }
    });
  }
  // Upper galleries and four stair runs. A wide undercroft remains traversable.
  for(const s of [-1,1]) {
    solid(0,3.86,s*23.9,55,.68,7.9,C.slate,3);
    solid(s*23.9,3.86,0,7.9,.68,40,C.slate,3);
    box(0,3.72,s*19.98,55,.25,.18,C.iron,1);
    box(s*19.98,3.72,0,.18,.25,40,C.iron,1);
    box(0,3.84,s*19.87,54,.075,.06,C.ember,2);
    box(s*19.87,3.84,0,.06,.075,39.8,C.ember,2);
    for(const a of [-1,1]){
      for(const x of [6,18]) {
        solid(s*x,1.8,a*22,1.25,3.6,1.58,C.iron,1);
        box(s*x,.18,a*22,1.75,.36,2.1,C.slate);
      }
      for(let k=0;k<16;k++) {
        const h=(k+1)*4.2/16,z=a*(8.32+k*.76);
        solid(s*14,h/2,z,4.15,h,.77,C.slate,3);
        box(s*14,h-.065,z-a*.38,4,.11,.085,k%4===3?C.brass:C.iron,1);
        if(k%4===0)box(s*14-1.73,h+.018,z,.34,.028,.18,C.ember,2);
      }
    }
    for(const z of [-14,0,14])rail(s*20.4,z,Math.PI/2,5.2);
    for(const x of [-5.15,5.15])rail(x,s*20.35,0,6.9);
  }
  // Heavy reactor dais and suspended segmented spire.
  lathe(0,0,[[0,4.7],[.19,4.95],[.38,4.65],[.45,4.15]],12,C.iron,1,0);
  lathe(0,0,[[.45,3.95],[.51,3.95]],12,C.ember,4,0);
  lathe(0,0,[[.52,3.38],[.57,3.5],[.85,3.23],[.87,2.85]],12,C.coal,1,0);
  lathe(0,0,[[.88,2.5],[.94,2.52]],12,C.orange,4,0);
  lathe(0,0,[[.97,1.52],[1.3,1.38],[1.55,.9]],8,C.iron,1,0);
  solids.push({x:0,y:.53,z:0,w:4.3,h:1.06,d:4.3});
  lathe(0,0,[[3.1,.035],[6.6,1.14],[9.8,.55],[11.3,.02]],6,C.ember,2,Math.PI/6);
  for(let i=0;i<6;i++){
    const a=i*TAU/6;
    at(.27*Math.sin(a),0,.27*Math.cos(a),a,()=>{
      profile([[-.78,7.1],[0,3.36],[.78,7.1],[.33,9.3],[0,11.7],[-.37,9.45]],.78,.57,C.coal,1);
      beam([-.76,7.2,1.075],[-.10,4.02,1.075],.055,.04,C.copper,1);
      beam([.76,7.2,1.075],[.10,4.01,1.075],.044,.04,C.orange,2);
      box(0,7.55,1.095,.105,.57,.028,C.ember,2);
      box(0,7.99,1.095,.11,.14,.028,C.brass,1);
    });
  }
  solids.push({x:0,y:7.2,z:0,w:2.12,h:7.2,d:2.12});
  for(let i=0;i<12;i++){
    const a=i*TAU/12;
    at(4.2*Math.sin(a),0,4.2*Math.cos(a),a,()=>{
      box(0,.46,0,.62,.54,.75,C.slate,1);
      box(0,.76,0,.43,.07,.45,C.brass,1);
      box(0,.79,-.07,.23,.065,.22,C.orange,2);
    });
  }
  // Non-playable skyline beyond the walls; staggered foundry spires and cliffs.
  for(let i=0;i<58;i++){
    const a=i*TAU/58,r=51+8*Math.sin(i*6.7),h=10+12*(.5+.5*Math.sin(i*7.1))*Math.cos(i*2.43)**2;
    const x=r*Math.sin(a),z=r*Math.cos(a);
    lathe(x,z,[[-3,4.7,4.4],[h*.68,2.5,2.3],[h,1.7,1.5],[h+2,.05,.08]],4,tint(C.slate,.7+(i%5)*.06),0,a);
    if(i%3===0)box(x,h*.6,z,3.55,.28,3.55,C.copper,1);
  }
  // Broken roof ribs frame the furnace, with inspection lights under their copper edges.
  for(const side of [-1,1])for(const z of [-23,-10,10,23]){
    at(side*26.8,0,z,0,()=>{
      const pts=[[side*.3,5.9],[-side*.6,11.3],[-side*3.6,15.7],[-side*8.6,18.5],[-side*13.9,19.7]];
      for(let i=0;i<pts.length-1;i++){
        const a=pts[i],b=pts[i+1];
        beam([...a,0],[...b,0],i<2?1.05:.72,1.26,C.coal,1);
        beam([a[0],a[1]-.34,.61],[b[0],b[1]-.34,.61],.13,.20,C.copper,1);
        beam([a[0],a[1]+.56,-.48],[b[0],b[1]+.56,-.48],.17,.22,C.light,1);
        box(b[0],b[1]-.55,0,.57,.25,1.41,C.iron,1);
        box(b[0],b[1]-.70,.05,.26,.09,.64,C.white,2);
      }
    });
  }

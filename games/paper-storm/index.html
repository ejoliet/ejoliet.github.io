<script>// Folded, vertex-coloured paper models. All lengths use world units; the nose points +Z.
const PaperModels = (() => {
  const rgbCache = new Map();
  function color(hex) {
    if (!rgbCache.has(hex)) {
      const value = parseInt(hex, 16);
      rgbCache.set(hex, [(value >> 16) / 255, (value >> 8 & 255) / 255, (value & 255) / 255]);
    }
    return rgbCache.get(hex);
  }
  function sheet() {
    const pos = [], col = [];
    function tri(a,b,c,ink) {
      pos.push(...a,...b,...c);
      const dye = color(ink);
      col.push(...dye,...dye,...dye);
    }
    function quad(a,b,c,d,ink) {tri(a,b,c,ink); tri(a,c,d,ink);}
    return {pos, col, tri, quad};
  }
  const mix = (a,b,t) => a.map((v,i) => v + (b[i]-v)*t);
  function beam(m,a,b,r,ink) {
    const direction=b.map((v,i)=>v-a[i]);
    const len=Math.hypot(...direction);
    const [x,y,z]=direction.map(v=>v/len);
    const h=Math.hypot(x,z);
    const u=h>.0001?[z/h,0,-x/h]:[1,0,0];
    const v=[y*u[2]-z*u[1],z*u[0]-x*u[2],x*u[1]-y*u[0]];
    let p=[], q=[];
    for(let k=0;k<4;k++){
      const t=k*Math.PI/2;
      const o=u.map((j,i)=>r*(j*Math.cos(t)+v[i]*Math.sin(t)));
      p.push(a.map((n,i)=>n+o[i]));q.push(b.map((n,i)=>n+o[i]));
    }
    for(let i=0;i<4;i++)m.quad(p[i],p[(i+1)%4],q[(i+1)%4],q[i],ink);
  }
  // Two-color rings are printed directly onto a wing's plane.
  function roundel(m,point,r,ink,paper) {
    const N=12;
    for(let i=0;i<N;i++){
      const t=i*2*Math.PI/N, s=(i+1)*2*Math.PI/N;
      const at=(ang,rad)=>point(Math.cos(ang)*rad,Math.sin(ang)*rad);
      m.quad(at(t,r),at(s,r),at(s,r*.64),at(t,r*.64),ink);
      m.tri(at(t,r*.64),at(s,r*.64),point(0,0),paper);
    }
  }
  function delta(m,p) {
    const nose=[0,.25,8], keel=[0,-1.65,-5.9];
    for(const s of [-1,1]){
      const P=(x,y,z)=>[s*x,y,z];
      // Every strip converges on the same leading fold at the nose.
      const rear=[
        P(.04,1.02,-5.55),P(.78,.03,-4.8),P(1.24,-.18,-4.97),
        P(3.82,.04,-5.8),P(4.10,.065,-5.89),P(4.35,.09,-5.97),
        P(5.44,.20,-6.33),P(5.72,.24,-6.42),P(6.65,.92,-6.75)
      ];
      const dyes=[s>0?p.shadow:p.ink,p.shadow,s>0?p.base:p.light,p.accent,p.light,p.base,p.accent,p.ink];
      for(let i=0;i<rear.length-1;i++)m.tri(nose,rear[i],rear[i+1],dyes[i]);
      m.tri(nose,rear[1],keel,p.ink);
      m.tri(rear[0],rear[1],keel,p.shadow);
      m.tri(nose,rear[0],P(.02,1.36,-5.9),p.light);
      // A stamped roundel on the broad, pale panel.
      const a=rear[2], b=rear[3];
      const point=(x,z)=>{
        const tu=.69+z*.053, tv=.5+x*.52;
        const v=mix(nose,mix(a,b,tv),tu);
        v[1]+=.022;return v;
      };
      roundel(m,point,.32,p.ink,p.accent);
      const outer=rear[rear.length-1], inside=rear[rear.length-2];
      m.tri(outer,inside,[outer[0],outer[1]-.22,outer[2]+.12],p.shadow);
    }

}
function start(type,guestModel=model){mode=type;newWorld(type,guestModel);enterPlay()}
function toMenu(){
 disconnect();phase='menu';world=null;closeDialog();$('hangar').hidden=false;$('flightBar').hidden=true;menuRect=null;cameras=[];resetInputs();layoutTouch();
 if(location.hash)try{history.replaceState(null,'',location.href.split('#')[0])}catch{}
 const pref=clamp(Number(stored('theme'))||0,0,2);if(pref!==theme)changeScene(pref);updateSelections();pickMode(mode);
}
function setPause(on){
 if(!world||world.result)return;resetInputs();accum=0;
 if(on){phase='pause';layoutTouch();dialog('Flight paused','<p>'+modes[mode]+' · '+places[theme]+'</p><button class="primary" id="resume">Resume flight</button><button class="secondary" id="quit">Back to hangar</button>');$('resume').onclick=pauseGame;$('quit').onclick=toMenu}
 else{phase='play';closeDialog();layoutTouch();lastTime=performance.now()/1000}
}
function hostPause(on){setPause(on);transmit({type:'pause',value:on})}
function pauseGame(){if(phase!=='pause'&&phase!=='play')return;const on=phase==='play';if(role==='guest'){transmit({type:'pause',value:on});return}if(role==='host')hostPause(on);else setPause(on)}
$('pause').onclick=pauseGame;
document.addEventListener('visibilitychange',()=>{if(document.hidden){resetInputs();if(phase==='play')pauseGame()}else{lastTime=performance.now()/1000;recoverReply()}});
function recoverReply(){if(role!=='host'||!session||applied)return;try{const e=JSON.parse(localStorage.getItem('paperstorm.handoff'));if(e?.type==='reply'&&e.sid===session)incomingLocal(e)}catch{}}
function finish(){
 if(phase==='end')return;phase='end';resetInputs();layoutTouch();
 const p=world.p[role==='guest'?1:0],record=Math.max(Number(stored('best.'+mode))||0,p.score);save('best.'+mode,record);
 const result=world.result==='Pilot 1 wins'&&role==='host'||world.result==='Pilot 2 wins'&&role==='guest'?'Duel won':world.result;
 dialog(result,'<p>'+modes[mode]+' · '+places[theme]+'</p><p class="keyline">'+p.score+' points · '+p.kills+' downed'+(mode==='solo'?' · Wave '+world.wave:'')+'</p><p>Best score · '+record+'</p>'+(role?'':'<button class="primary" id="retry">Fly again</button>')+'<button class="secondary" id="hangarAgain">Back to hangar</button>');
 if($('retry'))$('retry').onclick=()=>start(mode);$('hangarAgain').onclick=toMenu;
}
function frame(ms){
 const now=ms/1000,dt=clamp(now-lastTime,0,.10);lastTime=now;realTime+=dt;
 pollPads();
 if(phase==='play'){
 if(role!=='guest'){
 const inputs=[readInput(0),role==='host'?(performance.now()-inputAt<450?remoteInput:blank()):readInput(1)];accum+=dt;
 while(accum>=STEP){tick(STEP,inputs);accum-=STEP}
 if(world.result){if(role==='host')transmit({type:'state',state:world});finish()}
 }
 networkTick(dt);
 }
 audioTick();paint(realTime,dt);requestAnimationFrame(frame);
}
function boot(){
 model=clamp(parseInt(stored('frame'),10)||0,0,2);const pref=stored('control');control=['auto','key','pad','touch'].includes(pref)?pref:'auto';
 makeModels();if(gl)initGL();changeScene(clamp(parseInt(stored('theme'),10)||0,0,2));updateSelections();pickMode('solo');syncSound();resize();
 window.addEventListener('resize',resize);window.visualViewport?.addEventListener('resize',resize);new ResizeObserver(()=>{menuRect=null}).observe($('hero'));
 cv.addEventListener('webglcontextlost',e=>{e.preventDefault();if(phase==='play')pauseGame();toast('Graphics paused · restoring the arena')});
 cv.addEventListener('webglcontextrestored',()=>{cache=new Map();initGL();resize()});
 if(/^#(join|reply)=/.test(location.hash))handleLink(location.href);requestAnimationFrame(frame);
}
boot();
</script></body></html>
